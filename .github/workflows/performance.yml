name: Browser performance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BIOCLIP_DIR: .performance-bioclip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        id: bioclip
        with:
          path: ${{ env.BIOCLIP_DIR }}
          key: zooketch-bioclip-int8-${{ hashFiles('src/recognition/bioclip-model.json') }}
      - name: Download pinned recognition model
        if: steps.bioclip.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$BIOCLIP_DIR"
          url="$(node -p 'require("./src/recognition/bioclip-model.json").url')"
          curl --location --fail --silent --show-error --retry 2 --max-time 180 \
            "$url" --output "$BIOCLIP_DIR/${url##*/}"
      - run: npm run build
      - name: Measure and enforce budgets
        run: |
          node tools/recognition/performance.mjs dist "$BIOCLIP_DIR" > performance.json
          cat performance.json
          node tools/recognition/performance-budget.mjs performance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-performance
          path: performance.json
          if-no-files-found: ignore
